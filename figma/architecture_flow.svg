<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1116 1042" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="af-bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CEFF1A" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#8247FF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="af-card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181F" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#090B0E" stop-opacity="0.96"/>
    </linearGradient>

    <!-- NEXA CORE Glass Gradient -->
    <linearGradient id="af-nexa-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E160E" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#080C08" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#050805" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Laser Line Gradients -->
    <linearGradient id="af-laser-btc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7931A" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#CEFF1A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#CEFF1A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="af-laser-eth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#627EEA" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#C084FC" stop-opacity="1"/>
      <stop offset="100%" stop-color="#8247FF" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="af-laser-vertical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CEFF1A" stop-opacity="1"/>
      <stop offset="70%" stop-color="#CEFF1A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#EAFF4F" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="af-glow-lime" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="af-glow-subtle-lime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="af-glow-orange" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="af-glow-purple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="af-shadow-card" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <style>
    .af-text-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    .af-text-display { font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif; }
    .af-text-mono { font-family: 'JetBrains Mono', monospace, monospace; }
  </style>

  <!-- Ambient Glow Backgrounds -->
  <rect x="100" y="50" width="916" height="942" fill="url(#af-bg-glow)" pointer-events="none" />
  <circle cx="558" cy="650" r="320" fill="#CEFF1A" opacity="0.05" filter="url(#af-glow-lime)" pointer-events="none" />

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 01. ENERGY CONDUITS / CONNECTING PATHS (RENDERED BEHIND CARDS) -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- BTC to NEXA CORE Conduit -->
  <path d="M 406 122 C 480 122, 532 170, 540 236" fill="none" stroke="#CEFF1A" stroke-width="4" opacity="0.25" filter="url(#af-glow-lime)"/>
  <path d="M 406 122 C 480 122, 532 170, 540 236" fill="none" stroke="url(#af-laser-btc)" stroke-width="2.2" filter="url(#af-glow-subtle-lime)"/>

  <!-- ETH to NEXA CORE Conduit -->
  <path d="M 710 122 C 636 122, 584 170, 576 236" fill="none" stroke="#C084FC" stroke-width="4" opacity="0.25" filter="url(#af-glow-purple)"/>
  <path d="M 710 122 C 636 122, 584 170, 576 236" fill="none" stroke="url(#af-laser-eth)" stroke-width="2.2" filter="url(#af-glow-subtle-lime)"/>

  <!-- Conduit Junction Nodes / Pulse Dots -->
  <circle cx="406" cy="122" r="3.5" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>
  <circle cx="710" cy="122" r="3.5" fill="#C084FC" filter="url(#af-glow-subtle-lime)"/>
  <circle cx="540" cy="236" r="3" fill="#CEFF1A"/>
  <circle cx="576" cy="236" r="3" fill="#C084FC"/>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 02. TOP ROW: CRYPTO ASSET SOURCE CARDS                      -->
  <!-- ═══════════════════════════════════════════════════════════ -->

  <!-- ── CARD LEFT: BTC (Native Custody) ── -->
  <g filter="url(#af-shadow-card)">
    <!-- Ambient Halo -->
    <rect x="156" y="76" width="250" height="92" rx="18" fill="#F7931A" opacity="0.12" filter="url(#af-glow-orange)"/>
    <!-- Card Container -->
    <rect x="156" y="76" width="250" height="92" rx="18" fill="url(#af-card-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="157" y="77" width="248" height="90" rx="17" fill="none" stroke="rgba(247,147,26,0.25)" stroke-width="1"/>

    <!-- Bitcoin Circle Icon -->
    <circle cx="196" cy="122" r="22" fill="#F7931A"/>
    <!-- Bitcoin Symbol -->
    <path d="M 197.5 110.5 v -2.5 h -2 v 2.5 h -2 v -2.5 h -2 v 2.5 h -4 v 2.5 h 2 v 18 h -2 v 2.5 h 4 v 2.5 h 2 v -2.5 h 2 v 2.5 h 2 v -2.5 c 3.5 0 6 -0.8 7 -3.5 c 0.8 -2.2 0.2 -3.8 -1.2 -4.8 c 1.8 -1 2.5 -2.6 2.2 -4.5 c -0.5 -2.8 -3.2 -3.7 -7 -3.7 z m -4.5 2.5 h 4.5 c 2 0 3.8 0.6 3.8 2.5 c 0 2 -1.8 2.5 -3.8 2.5 h -4.5 z m 0 8 h 5.2 c 2.2 0 4.2 0.7 4.2 2.8 c 0 2.2 -2 2.8 -4.2 2.8 h -5.2 z" fill="#FFFFFF"/>

    <!-- BTC Label & Subtitle -->
    <text x="232" y="115" class="af-text-sans" font-size="19" font-weight="700" fill="#FFFFFF">BTC<tspan font-size="10" dy="-8" fill="#9CA3AF font-weight-normal">®</tspan></text>
    <text x="232" y="138" class="af-text-mono" font-size="11" font-weight="400" fill="#8E95A2">Native Custody</text>

    <!-- Upward Trend Chart Line (Lime) -->
    <path d="M 324 136 L 342 132 L 354 138 L 372 120 L 388 112" fill="none" stroke="#CEFF1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#af-glow-subtle-lime)"/>
    <!-- Chart Pointer Dot -->
    <circle cx="388" cy="112" r="2.5" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>
  </g>

  <!-- ── CARD RIGHT: ETH (Smart Liquidity) ── -->
  <g filter="url(#af-shadow-card)">
    <!-- Ambient Halo -->
    <rect x="710" y="76" width="250" height="92" rx="18" fill="#8247FF" opacity="0.14" filter="url(#af-glow-purple)"/>
    <!-- Card Container -->
    <rect x="710" y="76" width="250" height="92" rx="18" fill="url(#af-card-bg)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="711" y="77" width="248" height="90" rx="17" fill="none" stroke="rgba(192,132,252,0.25)" stroke-width="1"/>

    <!-- Ethereum Circle Icon -->
    <circle cx="750" cy="122" r="22" fill="#58468E"/>
    <!-- Ethereum Diamond Symbol -->
    <polygon points="750,107 759,122 750,127 741,122" fill="#FFFFFF" fill-opacity="0.95"/>
    <polygon points="750,129 759,124 750,137 741,124" fill="#FFFFFF" fill-opacity="0.95"/>
    <polygon points="750,107 750,127 741,122" fill="#DFE3E8" fill-opacity="0.75"/>
    <polygon points="750,129 750,137 741,124" fill="#DFE3E8" fill-opacity="0.75"/>

    <!-- ETH Label & Subtitle -->
    <text x="786" y="115" class="af-text-sans" font-size="19" font-weight="700" fill="#FFFFFF">ETH</text>
    <text x="786" y="138" class="af-text-mono" font-size="11" font-weight="400" fill="#8E95A2">Smart Liquidity</text>

    <!-- Upward Trend Chart Line (Purple) -->
    <path d="M 876 138 L 892 134 L 905 139 L 925 118 L 942 108" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#af-glow-subtle-lime)"/>
    <!-- Chart Pointer Dot -->
    <circle cx="942" cy="108" r="2.5" fill="#C084FC"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 03. NEXA CORE PROCESSING HUB                                -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g filter="url(#af-shadow-card)">
    <!-- Soft Outer Neon Glow -->
    <rect x="311" y="236" width="494" height="98" rx="20" fill="#CEFF1A" opacity="0.14" filter="url(#af-glow-lime)"/>

    <!-- Outer Card Frame -->
    <rect x="311" y="236" width="494" height="98" rx="20" fill="url(#af-nexa-bg)" stroke="#CEFF1A" stroke-opacity="0.45" stroke-width="1.4"/>
    <rect x="312" y="237" width="492" height="96" rx="19" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- NEXA Core Hexagon Emblem -->
    <g transform="translate(366, 285)">
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="none" stroke="#CEFF1A" stroke-width="2.5" filter="url(#af-glow-subtle-lime)"/>
      <polygon points="0,-10 9,-5 9,5 0,10 -9,5 -9,-5" fill="#CEFF1A" opacity="0.9"/>
      <circle cx="0" cy="0" r="3" fill="#000000"/>
    </g>

    <!-- Heading: NEXA CORE -->
    <text x="402" y="278" class="af-text-display" font-size="21" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">NEXA CORE</text>

    <!-- PROCESSING Badge -->
    <rect x="556" y="260" width="118" height="24" rx="12" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>
    <text x="615" y="276" class="af-text-mono" font-size="10.5" font-weight="700" fill="#000000" letter-spacing="0.8" text-anchor="middle">PROCESSING</text>

    <!-- Description -->
    <text x="402" y="306" class="af-text-sans" font-size="13.5" font-weight="400" fill="#A1A1AA">Autonomous routing &amp; zero-slippage conversion</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 04. DOWNWARD DIRECT LASER RAYS                              -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g>
    <!-- Broad Ambient Beam Glow -->
    <rect x="502" y="334" width="112" height="150" fill="url(#af-bg-glow)" opacity="0.4" pointer-events="none"/>

    <!-- 5 Parallel Vertical Beams -->
    <!-- Beam 1 -->
    <line x1="510" y1="334" x2="510" y2="480" stroke="url(#af-laser-vertical)" stroke-width="2" filter="url(#af-glow-subtle-lime)"/>
    <polygon points="510,486 507,478 513,478" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>

    <!-- Beam 2 -->
    <line x1="534" y1="334" x2="534" y2="480" stroke="url(#af-laser-vertical)" stroke-width="2" filter="url(#af-glow-subtle-lime)"/>
    <polygon points="534,486 531,478 537,478" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>

    <!-- Beam 3 (Center) -->
    <line x1="558" y1="334" x2="558" y2="480" stroke="url(#af-laser-vertical)" stroke-width="2.5" filter="url(#af-glow-subtle-lime)"/>
    <polygon points="558,487 554.5,478 561.5,478" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>

    <!-- Beam 4 -->
    <line x1="582" y1="334" x2="582" y2="480" stroke="url(#af-laser-vertical)" stroke-width="2" filter="url(#af-glow-subtle-lime)"/>
    <polygon points="582,486 579,478 585,478" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>

    <!-- Beam 5 -->
    <line x1="606" y1="334" x2="606" y2="480" stroke="url(#af-laser-vertical)" stroke-width="2" filter="url(#af-glow-subtle-lime)"/>
    <polygon points="606,486 603,478 609,478" fill="#CEFF1A" filter="url(#af-glow-subtle-lime)"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 05. NUPAY SMART CARD, PEDESTAL & HAND COMPOSITION           -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- Embedded High-Resolution Base Composition for 100% Visual Parity -->
  <g transform="translate(196, 370)">
    <!-- Base Render clipped seamlessly -->
    <image
      href="./1_chatgpt_image_sep_20__2026__01_53_40_pm_topaz_bloom_2x_scale_1.png"
      x="-196"
      y="-370"
      width="1116"
      height="1042"
      preserveAspectRatio="xMidYMid meet"
    />
  </g>

  <!-- Vector Overlay Accents ensuring razor-sharp edges & glow -->
  <!-- Laser Beam contact sparks on card -->
  <g filter="url(#af-glow-lime)">
    <circle cx="510" cy="486" r="3" fill="#EAFF4F"/>
    <circle cx="534" cy="486" r="3" fill="#EAFF4F"/>
    <circle cx="558" cy="487" r="3.5" fill="#FFFFFF"/>
    <circle cx="582" cy="486" r="3" fill="#EAFF4F"/>
    <circle cx="606" cy="486" r="3" fill="#EAFF4F"/>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 06. BOTTOM ROW: PAYMENT COMPLETED STATUS BAR                -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g filter="url(#af-shadow-card)">
    <!-- Ambient Halo -->
    <rect x="208" y="848" width="700" height="94" rx="24" fill="#CEFF1A" opacity="0.08" filter="url(#af-glow-lime)"/>

    <!-- Bar Container -->
    <rect x="208" y="848" width="700" height="94" rx="24" fill="#0A0D10" fill-opacity="0.96" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
    <rect x="209" y="849" width="698" height="92" rx="23" fill="none" stroke="rgba(206,255,26,0.15)" stroke-width="1"/>

    <!-- Credit Card Icon -->
    <g transform="translate(242, 878)">
      <rect x="0" y="0" width="38" height="26" rx="5" fill="none" stroke="#CEFF1A" stroke-width="2.2" filter="url(#af-glow-subtle-lime)"/>
      <line x1="0" y1="7" x2="38" y2="7" stroke="#CEFF1A" stroke-width="2"/>
      <rect x="6" y="15" width="8" height="5" rx="1.5" fill="#CEFF1A"/>
    </g>

    <!-- Vertical Separator -->
    <line x1="304" y1="872" x2="304" y2="918" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>

    <!-- Label: PAYMENT COMPLETED -->
    <text x="328" y="899" class="af-text-display" font-size="15.5" font-weight="700" fill="#FFFFFF" letter-spacing="1.2">PAYMENT COMPLETED</text>

    <!-- Pill Button: ₹ 4,820 PAID -->
    <g filter="url(#af-glow-subtle-lime)">
      <rect x="658" y="865" width="224" height="60" rx="30" fill="#D4FF28"/>
      <text x="770" y="902" class="af-text-display" font-size="18.5" font-weight="700" fill="#000000" text-anchor="middle" letter-spacing="0.5">₹ 4,820 PAID</text>
    </g>
  </g>
</svg>
